name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: app
        run: pytest app/tests/

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t 8byte-devops-app:${{ github.sha }} ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: 8byte-devops-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build-and-push:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - dependency-scan
      - container-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/8byte-devops-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/8byte-devops-app:latest

  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull staging image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/8byte-devops-app:${{ github.sha }}

      - name: Start staging container
        run: |
          docker run -d \
            --name staging-app \
            -p 8080:8080 \
            ghcr.io/${{ github.repository_owner }}/8byte-devops-app:${{ github.sha }}

      - name: Run staging smoke test
        run: |
          sleep 5
          curl --fail http://localhost:8080/health

      - name: Stop staging container
        if: always()
        run: |
          docker stop staging-app || true
          docker rm staging-app || true

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Production deployment approval received
        run: |
          echo "Production deployment approved."
          echo "Deploying image:"
          echo "ghcr.io/${{ github.repository_owner }}/8byte-devops-app:${{ github.sha }}"

      - name: Production deployment
        run: |
          echo "Production deployment completed successfully."

  notify-failure:
    name: Notify on Failure
    if: ${{ always() && failure() }}
    needs:
      - test
      - dependency-scan
      - container-scan
      - build-and-push
      - deploy-staging
      - deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured. Skipping notification."
            exit 0
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"CI/CD pipeline failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF}. Commit: ${GITHUB_SHA}\"}" \
            "$SLACK_WEBHOOK_URL"
